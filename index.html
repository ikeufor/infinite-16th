<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobox Maker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Photobox Maker</h1>

        <input
            type="file"
            id="photoInput"
            accept="image/*"
            multiple
        >

        <button id="generateBtn">
            Generate
        </button>

        <button id="downloadBtn">
            Download
        </button>

        <canvas id="canvas"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
